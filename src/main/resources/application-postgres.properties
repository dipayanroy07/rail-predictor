# Activated with SPRING_PROFILES_ACTIVE=postgres. Re-enables the DataSource/JPA/Flyway
# auto-configuration excluded by default in application.properties, and configures the
# connection - never hardcode credentials, always via env var.
spring.autoconfigure.exclude=

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/railpredictor}
spring.datasource.username=${DB_USERNAME:railpredictor}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate must only validate against it, never auto-generate/alter.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
