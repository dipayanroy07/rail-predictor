spring.application.name=RailPredictor

# Health/readiness endpoint only (Phase 26) - deliberately does NOT expose the full actuator
# surface (env/beans/configprops can leak internals or secrets) - only /actuator/health, and only
# UP/DOWN by default (no component detail) unless explicitly authorized, matching this codebase's
# "never expose more than necessary" convention for the REST layer too.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Historical observation persistence (Phase 16A) is opt-in via the "postgres" profile
# (application-postgres.properties activates SPRING_PROFILES_ACTIVE=postgres) - by default,
# no DataSource/JPA/Flyway auto-configuration runs at all, so the app and its tests work with
# no database configured or reachable. HistoricalObservationRecorder degrades to a no-op
# when there's no repository bean, exactly like the mock weather/historical providers degrade
# when their real counterparts are unavailable.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# RailRadar (https://railradar.in/docs) - never hardcode the API key, always via env var.
railradar.base-url=${RAILRADAR_BASE_URL:https://api.railradar.in}
railradar.api-key=${RAILRADAR_API_KEY:}
railradar.timeout=${RAILRADAR_TIMEOUT:5s}

# Section analysis thresholds - assumed, not empirically validated (see docs/architecture.md).
# Below normal-threshold-minutes: CLEAR. Between the two: NORMAL. At/above busy-threshold: BUSY.
route.section-analysis.normal-threshold-minutes=${ROUTE_NORMAL_THRESHOLD_MINUTES:10}
route.section-analysis.busy-threshold-minutes=${ROUTE_BUSY_THRESHOLD_MINUTES:30}

# Weather provider selection (Phase 17) - "mock" (default) or "openmeteo". Deterministic: exactly
# one WeatherProvider bean ever exists, never a silent fallback between them.
weather.provider=${WEATHER_PROVIDER:mock}

# Mock weather reading, used when weather.provider=mock (the default).
weather.mock.condition=${WEATHER_MOCK_CONDITION:CLEAR}
weather.mock.temperature-celsius=${WEATHER_MOCK_TEMPERATURE_CELSIUS:25.0}
weather.mock.visibility-meters=${WEATHER_MOCK_VISIBILITY_METERS:10000}
weather.mock.precipitation-mm=${WEATHER_MOCK_PRECIPITATION_MM:0.0}

# Open-Meteo (https://open-meteo.com/en/docs), used when weather.provider=openmeteo. Free/
# non-commercial use needs no API key at all - leave WEATHER_OPENMETEO_API_KEY unset unless a paid
# Open-Meteo plan is in use. Never hardcode it if set.
weather.openmeteo.base-url=${WEATHER_OPENMETEO_BASE_URL:https://api.open-meteo.com}
weather.openmeteo.api-key=${WEATHER_OPENMETEO_API_KEY:}
weather.openmeteo.timeout=${WEATHER_OPENMETEO_TIMEOUT:5s}
# Visibility (meters) at or below which fog (WMO code 45/48) is classified DENSE_FOG rather than
# FOG - 200m mirrors the India Meteorological Department's own "dense fog" definition.
weather.openmeteo.dense-fog-visibility-meters=${WEATHER_OPENMETEO_DENSE_FOG_VISIBILITY_METERS:200}

# Mock historical delay stats, used until real historical data is available (Phase 16).
# sample-count=0 means "no historical data" - the honest default.
historical.mock.average-delay-minutes=${HISTORICAL_MOCK_AVERAGE_DELAY_MINUTES:0}
historical.mock.median-delay-minutes=${HISTORICAL_MOCK_MEDIAN_DELAY_MINUTES:0}
historical.mock.standard-deviation-minutes=${HISTORICAL_MOCK_STANDARD_DEVIATION_MINUTES:0}
historical.mock.sample-count=${HISTORICAL_MOCK_SAMPLE_COUNT:0}

# Deterministic HistoricalDelayProvider selection (Phase 16B) - "mock" (default) or "postgres".
# Exactly one provider bean is ever active; there is no silent fallback from postgres to mock -
# see docs/historical-data-design.md. Setting "postgres" without also activating the "postgres"
# Spring profile (so HistoricalDelayProfileRepository exists) fails application startup loudly,
# by design, rather than silently serving mock data under a real-sounding label.
historical.provider=${HISTORICAL_PROVIDER:mock}

# Data-quality gate applied to raw observations before persistence (Phase 16C) - a delay beyond
# this many minutes is treated as corrupt/nonsensical rather than a genuinely extreme delay
# (an assumed sanity bound, not derived from real RailRadar data - see
# HistoricalObservationValidationProperties).
historical.observation-validation.max-plausible-delay-minutes=${HISTORICAL_OBSERVATION_MAX_PLAUSIBLE_DELAY_MINUTES:4320}

# Journey-identity mitigation (Phase 16E) - RailRadar carries no trustworthy journey-start-date
# field, so journeyDate remains an observation-date (see HistoricalJourneyDateProperties). Default
# 0 = midnight = identical to legacy behaviour. Set to e.g. 3 only if you know a specific overnight
# service's schedule and want observations before 3 AM local time attributed to the previous
# calendar day, reducing (not eliminating) the risk of one physical journey being split by polling
# that happens to straddle midnight.
historical.journey-date.operating-day-start-hour=${HISTORICAL_JOURNEY_DATE_OPERATING_DAY_START_HOUR:0}

# Scheduled historical-delay-profile refresh (Phase 16C) - runs independently of any prediction
# request; HistoricalDelayProfileRefreshScheduler is a no-op when no observation database is
# configured. Interval/initial-delay in milliseconds.
historical.profile-refresh.interval-ms=${HISTORICAL_PROFILE_REFRESH_INTERVAL_MS:3600000}
historical.profile-refresh.initial-delay-ms=${HISTORICAL_PROFILE_REFRESH_INITIAL_DELAY_MS:60000}

# Independent, scheduled real-data collection (Phase 22B) - fetches live RailRadar data for each
# explicitly configured train number, purely to record historical observations (never prediction,
# never a snapshot). Disabled by default, and safely empty (no trains configured) even when
# enabled - a real RailRadar request only ever happens once an operator opts in AND names specific
# trains. train-numbers is a comma-separated list of 5-digit train numbers (e.g. "12952,12002");
# see docs/historical-data-design.md's Phase 22B notes for the full reasoning, rate-limit
# considerations, and why trains are never auto-discovered.
historical.collection.enabled=${HISTORICAL_COLLECTION_ENABLED:false}
historical.collection.interval-ms=${HISTORICAL_COLLECTION_INTERVAL_MS:3600000}
historical.collection.initial-delay-ms=${HISTORICAL_COLLECTION_INITIAL_DELAY_MS:300000}
historical.collection.train-numbers=${HISTORICAL_COLLECTION_TRAIN_NUMBERS:}

# Mock section (delay-CHANGE) statistics, used until real section historical data is wired into
# prediction (Phase 16G - nothing consumes this yet). Unlike historical.mock.*, average/median are
# not constrained to be non-negative - a delay change can genuinely be negative (recovery).
historical.section.mock.average-delay-change-minutes=${HISTORICAL_SECTION_MOCK_AVERAGE_DELAY_CHANGE_MINUTES:0}
historical.section.mock.median-delay-change-minutes=${HISTORICAL_SECTION_MOCK_MEDIAN_DELAY_CHANGE_MINUTES:0}
historical.section.mock.standard-deviation-minutes=${HISTORICAL_SECTION_MOCK_STANDARD_DEVIATION_MINUTES:0}
historical.section.mock.sample-count=${HISTORICAL_SECTION_MOCK_SAMPLE_COUNT:0}

# Deterministic HistoricalSectionDelayProvider selection (Phase 16G) - a separate switch from
# historical.provider (the station-level provider's own selection), since nothing consumes section
# profiles yet and the two capabilities may be enabled independently. Same "no silent fallback"
# rule: "postgres" without the "postgres" Spring profile also active fails startup loudly.
historical.section-provider=${HISTORICAL_SECTION_PROVIDER:mock}

# Minimum section-level sample count before a profile is considered AVAILABLE rather than
# INSUFFICIENT_SAMPLES (Phase 16G) - deliberately NOT the same value as
# prediction.historical-adjustment.minimum-sample-count (see HistoricalSectionProperties for the
# variance-of-a-difference reasoning behind this default; it is an initial operational threshold,
# not a statistically proven one).
historical.section.minimum-sample-count=${HISTORICAL_SECTION_MINIMUM_SAMPLE_COUNT:10}

# Real railway operational disruption data (Phase 18) - provider foundation only; nothing in the
# application consumes this yet (see docs/architecture.md's Phase 18 source-research notes on why
# no reliable public machine-readable source of TSR/engineering-block/signal-failure data was
# found). "unavailable" (the default) is the honest state, NOT a stand-in for a future real
# provider the way weather.provider/historical.provider default to mock - there is no real
# provider to default away from yet. "mock" is opt-in only, for local testing/demonstration.
railway-disruption.provider=${RAILWAY_DISRUPTION_PROVIDER:unavailable}
railway-disruption.mock.enabled=${RAILWAY_DISRUPTION_MOCK_ENABLED:false}
railway-disruption.mock.type=${RAILWAY_DISRUPTION_MOCK_TYPE:TEMPORARY_SPEED_RESTRICTION}
railway-disruption.mock.train-number=${RAILWAY_DISRUPTION_MOCK_TRAIN_NUMBER:}
railway-disruption.mock.from-station-code=${RAILWAY_DISRUPTION_MOCK_FROM_STATION_CODE:}
railway-disruption.mock.to-station-code=${RAILWAY_DISRUPTION_MOCK_TO_STATION_CODE:}
railway-disruption.mock.restricted-speed-kmh=${RAILWAY_DISRUPTION_MOCK_RESTRICTED_SPEED_KMH:}
railway-disruption.mock.severity=${RAILWAY_DISRUPTION_MOCK_SEVERITY:}

# Disruption-to-delay policy (Phase 19) - every value below is a PROVISIONAL HEURISTIC, not derived
# from real evaluated outcomes (see docs/prediction-model.md's Phase 19 notes). Only used when a
# real/mock RailwayDisruption is currently active - see HeuristicDisruptionImpactPolicy.
railway-disruption-impact.engineering-block-default-delay-minutes=${RAILWAY_DISRUPTION_IMPACT_ENGINEERING_BLOCK_DEFAULT_DELAY_MINUTES:15}
railway-disruption-impact.signal-failure-default-delay-minutes=${RAILWAY_DISRUPTION_IMPACT_SIGNAL_FAILURE_DEFAULT_DELAY_MINUTES:10}
railway-disruption-impact.congestion-default-delay-minutes=${RAILWAY_DISRUPTION_IMPACT_CONGESTION_DEFAULT_DELAY_MINUTES:10}
railway-disruption-impact.max-single-disruption-delay-minutes=${RAILWAY_DISRUPTION_IMPACT_MAX_SINGLE_DELAY_MINUTES:60}
railway-disruption-impact.max-aggregate-delay-minutes=${RAILWAY_DISRUPTION_IMPACT_MAX_AGGREGATE_DELAY_MINUTES:90}

# Disruption simulation - assumed probabilities/ranges, not empirically validated
# (see docs/architecture.md). Each model's master switch is the corresponding
# SimulationContext.*Enabled flag / speedRestrictionKmh presence, not these properties.
simulation.disruption.heavy-rain.trigger-probability=${DISRUPTION_HEAVY_RAIN_PROBABILITY:0.5}
simulation.disruption.heavy-rain.min-delay-minutes=${DISRUPTION_HEAVY_RAIN_MIN_DELAY_MINUTES:5}
simulation.disruption.heavy-rain.max-delay-minutes=${DISRUPTION_HEAVY_RAIN_MAX_DELAY_MINUTES:20}

simulation.disruption.dense-fog.trigger-probability=${DISRUPTION_DENSE_FOG_PROBABILITY:0.5}
simulation.disruption.dense-fog.min-delay-minutes=${DISRUPTION_DENSE_FOG_MIN_DELAY_MINUTES:10}
simulation.disruption.dense-fog.max-delay-minutes=${DISRUPTION_DENSE_FOG_MAX_DELAY_MINUTES:30}

simulation.disruption.high-congestion.trigger-probability=${DISRUPTION_HIGH_CONGESTION_PROBABILITY:0.4}
simulation.disruption.high-congestion.min-delay-minutes=${DISRUPTION_HIGH_CONGESTION_MIN_DELAY_MINUTES:5}
simulation.disruption.high-congestion.max-delay-minutes=${DISRUPTION_HIGH_CONGESTION_MAX_DELAY_MINUTES:15}

simulation.disruption.engineering-block.trigger-probability=${DISRUPTION_ENGINEERING_BLOCK_PROBABILITY:0.3}
simulation.disruption.engineering-block.min-delay-minutes=${DISRUPTION_ENGINEERING_BLOCK_MIN_DELAY_MINUTES:15}
simulation.disruption.engineering-block.max-delay-minutes=${DISRUPTION_ENGINEERING_BLOCK_MAX_DELAY_MINUTES:45}

simulation.disruption.signal-halt.trigger-probability=${DISRUPTION_SIGNAL_HALT_PROBABILITY:0.3}
simulation.disruption.signal-halt.min-delay-minutes=${DISRUPTION_SIGNAL_HALT_MIN_DELAY_MINUTES:3}
simulation.disruption.signal-halt.max-delay-minutes=${DISRUPTION_SIGNAL_HALT_MAX_DELAY_MINUTES:10}

simulation.disruption.speed-restriction.flat-delay-minutes-when-not-computable=${DISRUPTION_SPEED_RESTRICTION_FLAT_DELAY_MINUTES:10}

# Cascade simulation - assumed decay model, not derived from real occupancy/headway data
# (see docs/architecture.md). Below the trigger threshold, nothing cascades.
simulation.cascade.minimum-trigger-delay-minutes=${CASCADE_MIN_TRIGGER_DELAY_MINUTES:10}
simulation.cascade.cascade-factor=${CASCADE_FACTOR:0.3}
simulation.cascade.max-depth=${CASCADE_MAX_DEPTH:3}
simulation.cascade.max-total-cascade-delay-minutes=${CASCADE_MAX_TOTAL_DELAY_MINUTES:30}
simulation.cascade.max-affected-entities=${CASCADE_MAX_AFFECTED_ENTITIES:3}

# Recovery simulation - assumed values, not empirically validated (see docs/architecture.md).
simulation.recovery.base-recovery-fraction=${RECOVERY_BASE_FRACTION:0.2}
simulation.recovery.adverse-weather-recovery-multiplier=${RECOVERY_ADVERSE_WEATHER_MULTIPLIER:0.5}
simulation.recovery.max-recovery-minutes-per-km=${RECOVERY_MAX_MINUTES_PER_KM:0.05}
simulation.recovery.flat-max-recovery-minutes-when-distance-unknown=${RECOVERY_FLAT_MAX_MINUTES:10}

# Prediction engine - assumed values, not empirically validated (see docs/prediction-model.md).
prediction.travel-time.assumed-average-speed-kmh-when-unknown=${PREDICTION_ASSUMED_AVERAGE_SPEED_KMH:60.0}
prediction.historical-adjustment.weight=${PREDICTION_HISTORICAL_ADJUSTMENT_WEIGHT:0.2}
prediction.historical-adjustment.minimum-sample-count=${PREDICTION_HISTORICAL_MINIMUM_SAMPLE_COUNT:5}

# Confidence scoring - assumed weights/thresholds, not empirically validated (see docs/architecture.md).
# Weights need not sum to 100 - the score is achieved-weight as a percentage of total weight.
prediction.confidence.weights.live-train-data-completeness=${CONFIDENCE_WEIGHT_LIVE_DATA:15}
prediction.confidence.weights.weather-availability=${CONFIDENCE_WEIGHT_WEATHER:10}
prediction.confidence.weights.historical-data-availability=${CONFIDENCE_WEIGHT_HISTORICAL:15}
prediction.confidence.weights.route-information-quality=${CONFIDENCE_WEIGHT_ROUTE:10}
prediction.confidence.weights.speed-availability=${CONFIDENCE_WEIGHT_SPEED:15}
prediction.confidence.weights.section-condition-reliability=${CONFIDENCE_WEIGHT_SECTION:10}
prediction.confidence.weights.simulation-stability=${CONFIDENCE_WEIGHT_SIMULATION:25}
prediction.confidence.thresholds.high-minimum-score=${CONFIDENCE_THRESHOLD_HIGH:80}
prediction.confidence.thresholds.medium-minimum-score=${CONFIDENCE_THRESHOLD_MEDIUM:60}
prediction.confidence.thresholds.low-minimum-score=${CONFIDENCE_THRESHOLD_LOW:35}
prediction.confidence.max-stable-triggered-disruptions=${CONFIDENCE_MAX_STABLE_DISRUPTIONS:1}

# Prediction accuracy tracking / backtesting foundation (Phase 16H-5) - disabled by default, since
# recording a snapshot on every live prediction is a new persistence side effect requiring explicit
# opt-in (see PredictionEvaluationProperties). Refresh interval/initial-delay in milliseconds,
# mirroring historical.profile-refresh.* exactly.
prediction.evaluation.enabled=${PREDICTION_EVALUATION_ENABLED:false}
prediction.evaluation.refresh-interval-ms=${PREDICTION_EVALUATION_REFRESH_INTERVAL_MS:3600000}
prediction.evaluation.refresh-initial-delay-ms=${PREDICTION_EVALUATION_REFRESH_INITIAL_DELAY_MS:120000}

# Independent, scheduled real-prediction collection (Phase 22F) - calls the real prediction
# pipeline for each already-configured historical.collection.train-numbers train, so
# prediction_snapshots accumulates without an operator repeatedly calling the live prediction
# endpoint by hand. Disabled by default, exactly like historical.collection.enabled/
# prediction.evaluation.enabled - a real scheduled prediction request (RailRadar/weather/
# historical/disruption calls, and a persisted snapshot when prediction.evaluation.enabled=true)
# is a genuinely new side effect requiring explicit opt-in. Deliberately has no train-numbers of
# its own - see PredictionCollectionProperties for why it reuses the historical-collection list
# rather than a second, independently-maintained one.
prediction.collection.enabled=${PREDICTION_COLLECTION_ENABLED:false}
prediction.collection.interval-ms=${PREDICTION_COLLECTION_INTERVAL_MS:3600000}
prediction.collection.initial-delay-ms=${PREDICTION_COLLECTION_INITIAL_DELAY_MS:600000}

# Empirical calibration/ablation evaluation (Phase 20) - opt-in, mirroring prediction.evaluation.
# enabled; attaches a CalibrationEvaluationReport to GET /api/v1/evaluation/accuracy when true.
# minimum-sample-count/validation-split/minimum-practical-improvement-percent are the only three
# tuning knobs this phase introduces - see docs/prediction-model.md's Phase 20 notes for exactly
# what each governs.
evaluation.calibration.enabled=${EVALUATION_CALIBRATION_ENABLED:false}
evaluation.calibration.minimum-sample-count=${EVALUATION_CALIBRATION_MINIMUM_SAMPLE_COUNT:30}
evaluation.calibration.validation-split=${EVALUATION_CALIBRATION_VALIDATION_SPLIT:0.3}
evaluation.calibration.minimum-practical-improvement-percent=${EVALUATION_CALIBRATION_MIN_IMPROVEMENT_PERCENT:5.0}
